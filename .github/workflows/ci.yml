name: ci

# Every pull request, not only those into `main`: a pull request with no checks
# reads as one that passed.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes.
permissions:
  contents: read

# Every job is a check with no side effect, so an obsolete run has nothing left
# to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Rust comes from `rustup`, which the runner image already carries, so no job
# depends on a third-party action for it. Python, Node and .NET come from
# GitHub's own `actions/setup-*`, at the versions each step's comment below
# gives a reason for. `docs/conventions/ci.md` states how the jobs are split
# and why each is named what it is.
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Windows and macOS as well as Linux: every consumer loads a native
      # library on all three, and pointer width, allocator behaviour, symbol
      # resolution and library naming are exactly what differs.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      # `extendedresearch-pyo3`'s tests embed an interpreter (`auto-initialize`),
      # so the build links against a shared libpython.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Node 22.18 and later import `.ts` files by stripping their types, which
      # is how the addon test reaches `npm/binding-runtime/src/` with no npm
      # install. The compiled package is the `release-assets` job's.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The .NET 8 SDK builds both `netstandard2.1` and `net8.0`.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log

      # A suite that did not run is not a suite that passed. `cargo test` exits 0
      # with nothing to run, and an `#[ignore]`d test lands in a column nothing
      # reads. The check is written once here as a composite action, so a
      # consuming package refers to it by commit instead of carrying the same
      # shell inline and letting the two drift.
      - name: Prove the tests ran
        uses: ./.github/actions/prove-tests-ran
        with:
          log: cargo-test.log

      # Every log CI hands the step above is one it should accept, so nothing
      # there shows it refusing anything. `tests/run.sh` runs its script against
      # real cargo logs it must refuse and must accept, on each platform's bash
      # and awk.
      - name: The zero-tests check refuses what it should
        shell: bash
        run: bash .github/actions/prove-tests-ran/tests/run.sh

      # The logs above are captured, so they cannot notice cargo changing its
      # summary line. This reads what this runner's cargo prints for a crate
      # with two passing tests and one ignored. Linux only: the fields are
      # libtest's, not the platform's.
      - name: The zero-tests check reads this cargo's summary line
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/actions/prove-tests-ran/tests/live.sh

      # The same refusal through `action.yml` itself, so its inputs reach the
      # script. `continue-on-error` keeps the job going, and the next step fails
      # unless this one did. The annotation it leaves is the refusal expected.
      - name: The action refuses a log with zero passed tests (expected to fail)
        id: refuses
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: ./.github/actions/prove-tests-ran
        with:
          log: .github/actions/prove-tests-ran/tests/zero-passed.log
      - name: The action's refusal failed its step
        if: runner.os == 'Linux'
        shell: bash
        env:
          OUTCOME: ${{ steps.refuses.outcome }}
        run: |
          echo "outcome=$OUTCOME"
          if [ "$OUTCOME" != failure ]; then
            echo "::error::The action accepted a log with zero passed tests."
            exit 1
          fi

      # The shared macros expanded in a real consumer, loaded into Node, with the
      # shared TypeScript run against it. The same zero-test rule as above: a
      # file whose tests all vanished would pass `node --test`.
      - name: Node addon
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p extendedresearch-napi-testaddon
          node --test crates/napi-testaddon/test/addon.test.mjs 2>&1 | tee node-test.log
          pass=$(awk '/^# pass / {print $3}' node-test.log)
          skipped=$(awk '/^# skipped / {print $3}' node-test.log)
          todo=$(awk '/^# todo / {print $3}' node-test.log)
          echo "pass=${pass:-0} skipped=${skipped:-0} todo=${todo:-0}"
          if [ "${pass:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ] || [ "${todo:-0}" -ne 0 ]; then
            echo "::error::The Node suite ran no test, or skipped one."
            exit 1
          fi

      - name: Conformance runner self-test
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s python/conformance/tests -v 2>&1 | tee unittest.log
          # `OK` alone: `OK (skipped=N)` is a test that did not run.
          if ! grep -qE '^Ran [1-9][0-9]* tests? ' unittest.log || ! grep -qx 'OK' unittest.log; then
            echo "::error::The conformance self-test ran no test, or skipped one."
            exit 1
          fi

      - name: .NET sources compile for netstandard2.1 and net8.0
        run: dotnet build dotnet/Interop.Build

      # ExtendedResearch.Interop against a real library, on each platform's own
      # library naming and loader.
      - name: .NET interop tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p extendedresearch-abi-testlib
          dotnet test dotnet/Interop.Tests 2>&1 | tee dotnet-test.log
          # `awk`, not `grep | grep`: grep exits 1 when it matches nothing, and
          # under `pipefail` that status is the pipeline's, so `set -e` would
          # kill the script at the assignment — in exactly the case this guard
          # exists for, the log with no result line at all. The job would still
          # fail, with no message and at a line that reads like a broken
          # command. awk prints nothing and exits 0, so the `if` below reports
          # what happened. `docs/conventions/ci.md` has the whole argument.
          passed=$(awk 'match($0, /Passed: +[0-9]+/) { s = substr($0, RSTART, RLENGTH); gsub(/[^0-9]/, "", s); print s }' dotnet-test.log | tail -1)
          skipped=$(awk 'match($0, /Skipped: +[0-9]+/) { s = substr($0, RSTART, RLENGTH); gsub(/[^0-9]/, "", s); print s }' dotnet-test.log | tail -1)
          echo "passed=${passed:-0} skipped=${skipped:-0}"
          if [ "${passed:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::The .NET suite ran no test, or skipped one."
            exit 1
          fi

  # `rust-version` is a promise to every consumer, and nothing else here builds
  # on 1.85. A newer API used by accident compiles on stable and fails only for
  # the consumer who pinned the older toolchain. Every crate keeps 1.85: the
  # pyo3 0.29 and napi 3 series declare 1.83 and 1.82.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install 1.85 --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo +1.85 test --workspace 2>&1 | tee cargo-test.log
      - name: Prove the tests ran
        uses: ./.github/actions/prove-tests-ran
        with:
          log: cargo-test.log

  # The clock and metrology crates are target-independent: the browser face
  # compiles them to wasm, and a platform type or a `cfg` that leaked into
  # either would stop that build while every native job stayed green. A
  # different target is a different compiled graph, so it is its own job.
  # `cargo check` rather than a test run: the vectors run against the same
  # source in `check`, and `wasm32-unknown-unknown` has no test runner.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: The clock core compiles for wasm32
        run: cargo check --target wasm32-unknown-unknown -p extendedresearch-clock
      # `status` is `#![no_std]` without its default `std` feature, which is
      # what makes the codes usable from firmware. Only a build without that
      # feature can notice `std` creeping back in, and the default-features
      # build every other job makes cannot.
      - name: The status crate compiles without std
        run: |
          cargo check -p extendedresearch-status --no-default-features
          cargo check --target wasm32-unknown-unknown -p extendedresearch-status --no-default-features

      - name: The metrology core compiles for wasm32
        run: cargo check --target wasm32-unknown-unknown -p extendedresearch-metrology

  # The one check an ordinary test run cannot make. `borrow` makes references
  # from a caller's pointers, and whether that is sound over uninitialised
  # memory is a property of the abstract machine rather than of the output, so
  # a test passes either way. Miri interprets the tests and fails on undefined
  # behaviour.
  #
  # **The nightly is pinned**, because Miri ships only with nightly and an
  # unpinned one moves under an unchanged tree. Move the date deliberately.
  #
  # Scoped to the tests that hand pointers across: `crates/abi`'s own, and
  # `crates/abi-testlib`'s adapter driven through the conformance kit. The
  # discipline test and the doctests are left out: Miri's isolation refuses the
  # file reads the first does, and neither touches a pointer.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install nightly-2026-09-11 --profile minimal --component miri,rust-src
      - name: Test under Miri
        run: >-
          cargo +nightly-2026-09-11 miri test -p extendedresearch-abi
          --lib --test borrow --test buffer --test conformance
          --test enumeration --test binding
      - name: Test the adapter under Miri
        run: >-
          cargo +nightly-2026-09-11 miri test -p extendedresearch-abi-testlib
          --test conformance

  # Every release asset, built and checked on every pull request by the script
  # `release.yml` runs on a tag, so a release is never the first time the
  # packaging runs. Without a tag the script checks that every version agrees
  # with every other, rather than with a tag. Nothing is uploaded.
  # **The package boundaries, checked rather than described.** `ecosystem/check.py`
  # compares `ecosystem/PACKAGES.toml` against what the manifests resolve, in both
  # directions, refuses an undeclared copy of a file, and checks every package
  # carries the standard document set. Without this the declaration is a comment
  # and an unwanted dependency arrives as one manifest line nobody reads.
  #
  # Platform-independent, so it runs once rather than in the matrix. Not
  # `--strict`: README heading order is reported while the existing READMEs are
  # migrated, and fails the job once they are.
  ecosystem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `cargo metadata` is how the boundaries check reads every crate's edges.
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Run before the checks themselves. Three of these cover failures a
      # passing run cannot show you — a table that never printed, a workspace
      # that was never read, a package overwritten by its namesake — and every
      # one of them produces output indistinguishable from a clean tree.
      - name: The checks' own tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ecosystem/tests -v 2>&1 | tee ecosystem-tests.log
          # `OK` alone: `OK (skipped=N)` is a test that did not run.
          if ! grep -qE '^Ran [1-9][0-9]* tests? ' ecosystem-tests.log \
            || ! grep -qx 'OK' ecosystem-tests.log; then
            echo "::error::The ecosystem checks' tests ran no test, or skipped one."
            exit 1
          fi

      - name: Package boundaries, duplication, documents and citations
        run: python ecosystem/check.py all

      # `affected.py` decides what the `affected` job below may one day be
      # allowed to skip, so its own suite runs where the rest of the ecosystem
      # tooling is checked rather than inside the job whose answers it governs.
      # Synthetic graphs and a throwaway git repository; no cargo, no network.
      - name: The affected-package detection is correct
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s ecosystem/tests -v 2>&1 | tee affected-test.log
          # `OK` alone: `OK (skipped=N)` is a test that did not run.
          if ! grep -qE '^Ran [1-9][0-9]* tests? ' affected-test.log \
             || ! grep -qx 'OK' affected-test.log; then
            echo "::error::The affected-package suite ran no test, or skipped one."
            exit 1
          fi

      # **The tier rule, which nothing ran until now.** `check-tier.py` refuses a
      # tier-1 document that names a consuming repository's path, symbol or
      # constant — the coupling that makes foundation's documentation rot when a
      # consumer moves. It existed, it was run by hand, and a violation reached
      # `main` because a hand-run check is a check somebody has to remember.
      - name: The tier rule
        run: python docs/docs.tools/check-tier.py --root . --repo foundation

  # **What affected-package detection *would* select, computed and nothing
  # more.** Gate item 3 of `foundation/docs/decisions/0002-the-ecosystem-lives-in-one-repository.md`
  # exists because a monorepo that runs everything on every change gets slow,
  # and a slow suite is one people learn to skip.
  #
  # **No job is gated on this, deliberately.** Every job above runs
  # unconditionally and will keep running unconditionally. The only thing this
  # job does is publish an answer into a real run, next to the jobs that
  # actually ran, so the two can be compared over a stretch of ordinary changes.
  # Skipping a test because a script said so is a thing to earn.
  #
  # **What would have to be true before any job takes `needs: affected` and an
  # `if:`**, each of them a check rather than an intention:
  #
  #   1. A run of merged pull requests where the selected set is a superset of
  #      the packages whose suites actually failed. One counter-example — a
  #      suite that failed for a package the script did not select — is a
  #      defect that would have shipped, and resets the count.
  #   2. Every cross-package edge that exists only in a test harness is
  #      declared, or the packages on both ends are pinned into the selected
  #      set by hand. The two known today are in `affected.py`'s "what it
  #      cannot see": `crates/napi-testaddon`'s Node test loading
  #      `npm/binding-runtime/src/`, and `dotnet/Interop.Tests` running against
  #      a library built from `crates/abi-testlib`.
  #   3. `ExtendedResearch.Interop`'s shipped sources live under its declared
  #      `path`. They are in `dotnet/Interop/` while the package is declared at
  #      `dotnet/Interop.Package`, so today every change to them lands in the
  #      global bucket and selects everything — safe, and it means the script
  #      has never actually been exercised on that package's real diffs.
  #   4. A required check that cannot be skipped, so a pull request touching
  #      nothing still has a green tick a branch rule can require. A skipped
  #      job reports neither success nor failure, and a rule waiting on one
  #      waits forever.
  #
  # `fetch-depth: 0` because the answer is a diff against the base, and a
  # shallow clone has no merge base. Without it the script widens to everything
  # and the job is true but useless.
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
      json: ${{ steps.compute.outputs.json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # On a pull request the base is the branch it targets. On a push to main
      # the base is the commit before it; a first push gives an all-zero SHA
      # that does not resolve, and the script widens to everything rather than
      # guessing — which is the answer that cannot lose a test.
      - name: The base this change is judged against
        id: base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ]; then
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${BEFORE:-origin/main}" >> "$GITHUB_OUTPUT"
          fi
      # The full matrix in the log: every changed file with its owning package,
      # then every package with whether it was selected and why. A report of
      # only the selected set cannot distinguish "not affected" from "not
      # considered", and this job exists to be read.
      #
      # The base reaches every step below through `env`, never through `${{ }}`
      # inside a `run:` block. On a pull request it derives from
      # `github.base_ref`, which a fork's author chooses, and a branch named
      # with a backtick would otherwise be substituted into the shell before
      # the shell ever sees it.
      - name: Every package, selected or not, and why
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: python ecosystem/affected.py --base "$BASE" --explain
      - name: Expose the selected set
        id: compute
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          python ecosystem/affected.py --base "$BASE" > affected.txt
          echo "packages=$(tr '\n' ' ' < affected.txt)" >> "$GITHUB_OUTPUT"
          {
            echo 'json<<AFFECTED_JSON'
            python ecosystem/affected.py --base "$BASE" --json
            echo 'AFFECTED_JSON'
          } >> "$GITHUB_OUTPUT"
      # The comparison item 1 above asks for, made visible without anybody
      # opening the log.
      - name: Summary
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo '### Affected packages (advisory — nothing is gated on this)'
            echo
            echo "Base: \`$BASE\`"
            echo
            python ecosystem/affected.py --base "$BASE" | sed 's/^/- /'
            echo
            echo 'Every job in this workflow ran regardless. See the comment above'
            echo '`affected:` in `.github/workflows/ci.yml` for what would have to'
            echo 'hold before any job is allowed to skip.'
          } >> "$GITHUB_STEP_SUMMARY"

  release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # `cargo metadata` is how the script reads every crate's version.
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # The same exact pin as `release.yml`: the wheel and sdist a pull request
      # builds are then built the way the release builds them.
      - name: Install build
        run: python -m pip install build==1.6.1
      - name: Build the release assets
        run: bash scripts/build-release-assets.sh "$RUNNER_TEMP/release-assets"
