name: ci

# Every pull request, not only those into `main`: a pull request with no checks
# reads as one that passed.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes.
permissions:
  contents: read

# Every job is a check with no side effect, so an obsolete run has nothing left
# to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Rust comes from `rustup`, which the runner image already carries, so no job
# depends on a third-party action for it. The same choice as `ecosystem` and
# `eres`. Python, Node and .NET come from GitHub's own `actions/setup-*`, at the
# versions ranvier's workflow pins for the first two.
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Windows and macOS as well as Linux: every consumer loads a native
      # library on all three, and pointer width, allocator behaviour, symbol
      # resolution and library naming are exactly what differs.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      # `extendedresearch-pyo3`'s tests embed an interpreter (`auto-initialize`),
      # so the build links against a shared libpython.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Node 22.18 and later import `.ts` files by stripping their types, which
      # is how the addon test reaches `crates/napi/ts/` with no npm install.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The .NET 8 SDK builds both `netstandard2.1` and `net8.0`.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log

      # A suite that did not run is not a suite that passed. `cargo test` exits 0
      # with nothing to run, and an `#[ignore]`d test lands in a column nothing
      # reads. The action is the step ranvier, eres and plugins carry inline,
      # written once so they can refer to it by commit.
      - name: Prove the tests ran
        uses: ./.github/actions/prove-tests-ran
        with:
          log: cargo-test.log

      # The shared macros expanded in a real consumer, loaded into Node, with the
      # shared TypeScript run against it. The same zero-test rule as above: a
      # file whose tests all vanished would pass `node --test`.
      - name: Node addon
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p extendedresearch-napi-testaddon
          node --test crates/napi-testaddon/test/addon.test.mjs 2>&1 | tee node-test.log
          pass=$(awk '/^# pass / {print $3}' node-test.log)
          skipped=$(awk '/^# skipped / {print $3}' node-test.log)
          todo=$(awk '/^# todo / {print $3}' node-test.log)
          echo "pass=${pass:-0} skipped=${skipped:-0} todo=${todo:-0}"
          if [ "${pass:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ] || [ "${todo:-0}" -ne 0 ]; then
            echo "::error::The Node suite ran no test, or skipped one."
            exit 1
          fi

      - name: Conformance runner self-test
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s python/conformance/tests -v 2>&1 | tee unittest.log
          # `OK` alone: `OK (skipped=N)` is a test that did not run.
          if ! grep -qE '^Ran [1-9][0-9]* tests? ' unittest.log || ! grep -qx 'OK' unittest.log; then
            echo "::error::The conformance self-test ran no test, or skipped one."
            exit 1
          fi

      - name: .NET sources compile for netstandard2.1 and net8.0
        run: dotnet build dotnet/Interop.Build

      # ExtendedResearch.Interop against a real library, on each platform's own
      # library naming and loader.
      - name: .NET interop tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p extendedresearch-abi-testlib
          dotnet test dotnet/Interop.Tests 2>&1 | tee dotnet-test.log
          passed=$(grep -oE 'Passed: +[0-9]+' dotnet-test.log | grep -oE '[0-9]+' | tail -1)
          skipped=$(grep -oE 'Skipped: +[0-9]+' dotnet-test.log | grep -oE '[0-9]+' | tail -1)
          echo "passed=${passed:-0} skipped=${skipped:-0}"
          if [ "${passed:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::The .NET suite ran no test, or skipped one."
            exit 1
          fi

  # `rust-version` is a promise to every consumer, and nothing else here builds
  # on 1.85. A newer API used by accident compiles on stable and fails only for
  # the consumer who pinned the older toolchain. Every crate keeps 1.85: the
  # pyo3 0.29 and napi 3 series declare 1.83 and 1.82.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install 1.85 --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo +1.85 test --workspace 2>&1 | tee cargo-test.log
      - name: Prove the tests ran
        uses: ./.github/actions/prove-tests-ran
        with:
          log: cargo-test.log

  # The one check an ordinary test run cannot make. `borrow` makes references
  # from a caller's pointers, and whether that is sound over uninitialised
  # memory is a property of the abstract machine rather than of the output, so
  # a test passes either way. Miri interprets the tests and fails on undefined
  # behaviour.
  #
  # **The nightly is pinned**, because Miri ships only with nightly and an
  # unpinned one moves under an unchanged tree. Move the date deliberately.
  #
  # Scoped to the tests that hand pointers across: `crates/abi`'s own, and
  # `crates/abi-testlib`'s adapter driven through the conformance kit. The
  # discipline test and the doctests are left out: Miri's isolation refuses the
  # file reads the first does, and neither touches a pointer.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install nightly-2026-09-11 --profile minimal --component miri,rust-src
      - name: Test under Miri
        run: >-
          cargo +nightly-2026-09-11 miri test -p extendedresearch-abi
          --lib --test borrow --test buffer --test conformance
          --test enumeration --test binding
      - name: Test the adapter under Miri
        run: >-
          cargo +nightly-2026-09-11 miri test -p extendedresearch-abi-testlib
          --test conformance
