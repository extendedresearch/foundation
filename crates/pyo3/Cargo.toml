# What a package's PyO3 binding shares with every other package's: turning a
# core `AbiError` into a Python exception, and a foundation `Enumeration` into
# an `IntEnum`.
#
# **pyo3 moves in lockstep with every consumer.** `pyo3-ffi` declares
# `links = "python"`, and Cargo allows one package with a given `links` value in
# a build. A consumer whose pyo3 requirement resolves to a different minor
# series than this one fails to resolve rather than building two copies:
#
#     cargo tree -i pyo3-ffi      # in the consumer: exactly one version
#
# The requirement is `0.29` with `abi3-py311`, the pin
# `docs/conventions/toolchain-pins.md` states and every consumer repeats.
# `extension-module` is left to the consumer's `cdylib`, which is
# where it decides how the module links; enabling it here would stop this
# crate's own tests from linking an interpreter.
[package]
name = "extendedresearch-pyo3"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python exceptions and IntEnums for a package's PyO3 binding, from its AbiError and Enumeration."
readme = "README.md"
categories = ["api-bindings", "development-tools::ffi"]
keywords = ["pyo3", "python", "bindings", "abi"]

[lints]
workspace = true

[dependencies]
extendedresearch-abi = { version = "0.1.1", path = "../abi" }
extendedresearch-status = { version = "0.1.1", path = "../status" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }

[dev-dependencies]
# So `cargo test` embeds an interpreter and the tests run Python rather than
# only compile against it. Features unify, so this applies to test builds of
# this crate and never reaches a consumer.
pyo3 = { version = "0.29", features = ["abi3-py311", "auto-initialize"] }
