# What a package's napi-rs binding shares with every other package's: the error
# token protocol, BigInt conversion, and the `#[napi]` exports each binding
# repeats. The TypeScript that raises typed errors from them is the npm package
# `@extendedresearch/binding-runtime`, built from `npm/binding-runtime`.
#
# **napi moves in lockstep with every consumer, and nothing enforces it.**
# `napi-sys` declares no `links` value, so a consumer whose napi requirement
# resolves to a different major version builds a second copy beside this one,
# and the two disagree about every type that crosses between them — a
# `napi::Error` from here is not the consumer's `napi::Error`. The requirement
# is `3` for napi and napi-derive, the pin `docs/conventions/toolchain-pins.md`
# states and every consumer repeats. Check in the consumer:
#
#     cargo tree -i napi          # exactly one version
#
# **The consumer names napi and napi-derive in its own manifest.** The macros
# here expand to `#[napi]` items in the consumer, and the code napi-derive
# generates refers to the `napi` crate by that name.
[package]
name = "extendedresearch-napi"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Error tokens, BigInt conversion and exports for a package's napi-rs binding."
readme = "README.md"
categories = ["api-bindings", "development-tools::ffi"]
keywords = ["napi", "node", "bindings", "abi"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lints]
workspace = true

[dependencies]
extendedresearch-status = { version = "0.1.1", path = "../status" }
napi = { version = "3", default-features = false, features = ["napi6"] }

[dev-dependencies]
# `dyn-symbols` resolves Node-API through `libloading` at run time instead of
# declaring the symbols as link-time imports. A `cargo test` harness is an
# executable, which must resolve every import when it links; without this it
# links on Windows (where napi-sys always loads dynamically) and fails on Linux
# and macOS. The tests call nothing that needs Node.
napi = { version = "3", default-features = false, features = ["napi6", "dyn-symbols"] }
