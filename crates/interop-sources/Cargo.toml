# The C# sources of `ExtendedResearch.Interop`, carried as text.
#
# NuGet cannot read a git repository, so a package does not depend on the C#;
# it commits a copy into its .NET binding, compiled into its own assembly, and
# calls `assert_vendored` from a Rust test so the copy cannot drift from the
# commit it pins.
#
# **The sources live at `dotnet/Interop/` in the repository root, outside this
# crate's directory.** A git dependency checks out the whole repository, so the
# `include_str!` paths resolve. `cargo package` packages only this directory,
# so this crate cannot be published to crates.io until the sources move under
# it or are copied in by a build step.
[package]
name = "extendedresearch-interop-sources"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The C# sources of ExtendedResearch.Interop, for a package to vendor into its .NET binding."
readme = "README.md"
categories = ["api-bindings", "development-tools::ffi"]
keywords = ["dotnet", "csharp", "bindings", "abi"]

[lints]
workspace = true

[dependencies]

[dev-dependencies]
extendedresearch-abi = { path = "../abi" }
