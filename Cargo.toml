# The shared code every package built on these C ABI conventions depends on.
#
# **The packages take it as a git dependency on this public repository, pinned
# by commit**; `CONTEXT.md` has the line and the check that goes with it. It is
# the one dependency from outside its own tree a core package takes, and it
# resolves with no credential and no registry. Nothing is published to
# crates.io while the API is still moving, and `publish = false` stays absent so
# that it can be once it is not.
#
# **A crate lands here when two packages need the same runtime code**, not
# before. A crate with one consumer belongs in that consumer's repository.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/extendedresearch/foundation"

# The levels a consuming package repeats, so code moved between a package and
# here reads the same. `undocumented_unsafe_blocks` is the one level set for
# this repository alone, and it only fires in a crate that writes `unsafe`.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
